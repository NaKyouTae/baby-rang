name: Android Release

# v* 태그를 밀면 AAB를 빌드해 Play 내부 테스트 트랙에 올린다.
# 프로덕션 출시는 항상 Play Console에서 수동으로 승격(promote)한다.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      track:
        description: '업로드할 Play 트랙'
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta

jobs:
  release:
    name: AAB 빌드 및 Play 업로드
    runs-on: ubuntu-latest

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ⚠️ v3 는 Google 이 SDK 저장소에서 내린 구식 'tools' 패키지를 설치하려 해서
      #    "Failed to find package 'tools'" 로 실패한다. v4 에서 제거됐다.
      - name: Android SDK 설치
        uses: android-actions/setup-android@v4

      - name: SDK 구성요소 설치
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: 버전 확인 및 태그 일치 검증
        id: version
        run: |
          set -euo pipefail
          # 배포 대상은 네이티브 앱(android/)이다. TWA(twa/)는 이 앱으로 대체됐다.
          GRADLE=android/app/build.gradle
          VERSION_NAME=$(grep -oE 'versionName "[^"]+"' $GRADLE | head -1 | sed 's/.*"\(.*\)"/\1/')
          VERSION_CODE=$(grep -oE 'versionCode [0-9]+' $GRADLE | head -1 | awk '{print $2}')
          PACKAGE_ID=$(grep -oE 'applicationId "[^"]+"' $GRADLE | head -1 | sed 's/.*"\(.*\)"/\1/')

          # 네이티브 앱은 TWA와 같은 패키지라 같은 Play 리스팅을 덮어쓴다.
          # versionCode는 되돌릴 수 없는 정수라, TWA가 마지막으로 올린 값보다 커야
          # 업로드가 거부되지 않는다. pnpm version:* 가 두 파일을 함께 올리지만
          # 손으로 고친 경우를 대비해 여기서도 막는다.
          # pnpm version:* 는 두 값을 같은 번호로 맞춘다(같은 리스팅이므로 정상).
          # android 쪽만 갱신이 빠진 경우에만 막는다.
          TWA_CODE=$(node -p "require('./twa/twa-manifest.json').appVersionCode" 2>/dev/null || echo 0)
          if [ "$VERSION_CODE" -lt "$TWA_CODE" ]; then
            echo "::error::versionCode $VERSION_CODE 가 TWA($TWA_CODE)보다 낮습니다. pnpm version:patch 로 함께 올려주세요."
            exit 1
          fi

          # 태그로 실행된 경우 태그 이름과 앱 버전이 같은지 확인한다.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$VERSION_NAME" ]; then
              echo "::error::태그 v$TAG_VERSION 와 앱 버전 $VERSION_NAME 이 다릅니다. 버전 갱신 커밋이 태그에 포함됐는지 확인하세요."
              exit 1
            fi
          fi

          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "package=$PACKAGE_ID" >> "$GITHUB_OUTPUT"
          echo "✅ $PACKAGE_ID $VERSION_NAME ($VERSION_CODE)"

      - name: 키스토어 복원
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 시크릿이 비어 있습니다."
            exit 1
          fi
          echo "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/signing.keystore"

      - name: AAB 빌드
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/signing.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # 별칭은 비밀이 아니다(twa-manifest.json 에도 있다). 시크릿으로 둘 이유가 없다.
          ANDROID_KEY_ALIAS: my-key-alias
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: 서명 확인
        run: |
          set -euo pipefail
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          # 서명되지 않은 번들이 Play에 올라가는 것을 막는다.
          # jarsigner는 미서명이어도 종료코드 0을 반환하므로 출력 문자열로 판정한다.
          if ! jarsigner -verify "$AAB" | grep -q 'jar verified'; then
            echo "::error::AAB가 서명되지 않았습니다. 키스토어 시크릿을 확인하세요."
            exit 1
          fi
          echo "✅ 서명된 AAB 확인"

      - name: AAB 아티팩트 보관
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.version.outputs.name }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90

      - name: Play 트랙 업로드
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ steps.version.outputs.package }}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          releaseName: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
          status: completed

      - name: 요약
        run: |
          {
            echo "### Android 릴리스 완료"
            echo ""
            echo "- 패키지: \`${{ steps.version.outputs.package }}\`"
            echo "- 버전: **${{ steps.version.outputs.name }}** (versionCode ${{ steps.version.outputs.code }})"
            echo "- 트랙: \`${{ inputs.track || 'internal' }}\`"
            echo ""
            echo "Play Console에서 비공개 테스트/프로덕션으로 승격하면 출시됩니다."
          } >> "$GITHUB_STEP_SUMMARY"
