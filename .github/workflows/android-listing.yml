name: Android Listing

# Play 스토어 등록정보의 앱 이름을 바꾼다. AAB 를 다시 올리지 않고 등록정보만 고친다.
#
# 앱 이름은 Play Console 에서 직접 고칠 수도 있지만, 서비스 계정 키가 GitHub Secret 에만
# 있어서 로컬에서는 API 를 부를 수 없다. 그래서 워크플로로 둔다.
#
# dryRun 을 켜면 지금 값만 읽어 보여 주고 아무것도 바꾸지 않는다. 먼저 이걸로 확인할 것.
on:
  workflow_dispatch:
    inputs:
      title:
        description: '새 앱 이름 (30자 이내)'
        required: true
        type: string
      dryRun:
        description: '바꾸지 않고 현재 값만 확인'
        required: false
        default: true
        type: boolean

jobs:
  listing:
    name: 등록정보 앱 이름 변경
    runs-on: ubuntu-latest

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: 패키지명 확인
        id: pkg
        run: |
          set -euo pipefail
          PACKAGE_ID=$(grep -oE 'applicationId "[^"]+"' android/app/build.gradle | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "id=$PACKAGE_ID" >> "$GITHUB_OUTPUT"
          echo "패키지: $PACKAGE_ID"

      - name: 앱 이름 변경
        env:
          SA_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PACKAGE_ID: ${{ steps.pkg.outputs.id }}
          TITLE: ${{ inputs.title }}
          DRY_RUN: ${{ inputs.dryRun }}
        run: |
          set -euo pipefail
          printf '%s' "$SA_JSON" > "${RUNNER_TEMP}/sa.json"
          node --input-type=module - <<'JS'
          // top-level await 를 쓰므로 ES 모듈로 실행한다(require 와 섞으면 Node 가 형식을 못 정한다).
          import crypto from 'node:crypto';
          import fs from 'node:fs';

          const sa = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/sa.json`, 'utf8'));
          const pkg = process.env.PACKAGE_ID;
          const title = process.env.TITLE;
          const dryRun = process.env.DRY_RUN === 'true';
          const BASE = `https://androidpublisher.googleapis.com/androidpublisher/v3/applications/${pkg}`;

          if (title.length > 30) throw new Error(`앱 이름이 30자를 넘습니다(${title.length}자).`);

          const b64 = (o) => Buffer.from(JSON.stringify(o)).toString('base64url');

          async function token() {
            const now = Math.floor(Date.now() / 1000);
            const claim = {
              iss: sa.client_email,
              scope: 'https://www.googleapis.com/auth/androidpublisher',
              aud: 'https://oauth2.googleapis.com/token',
              iat: now,
              exp: now + 3600,
            };
            const unsigned = `${b64({ alg: 'RS256', typ: 'JWT' })}.${b64(claim)}`;
            const sig = crypto.sign('RSA-SHA256', Buffer.from(unsigned), sa.private_key).toString('base64url');
            const res = await fetch('https://oauth2.googleapis.com/token', {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body: new URLSearchParams({
                grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer',
                assertion: `${unsigned}.${sig}`,
              }),
            });
            const data = await res.json();
            if (!data.access_token) throw new Error(`토큰 발급 실패: ${JSON.stringify(data)}`);
            return data.access_token;
          }

          async function call(method, url, body) {
            const res = await fetch(url, {
              method,
              headers: {
                Authorization: `Bearer ${AT}`,
                ...(body ? { 'Content-Type': 'application/json' } : {}),
                ...(method === 'POST' && !body ? { 'Content-Length': '0' } : {}),
              },
              ...(body ? { body: JSON.stringify(body) } : {}),
            });
            const text = await res.text();
            const data = text ? JSON.parse(text) : {};
            if (!res.ok) throw new Error(`${method} ${url} → ${res.status} ${text.slice(0, 400)}`);
            return data;
          }

          const AT = await token();

          const edit = await call('POST', `${BASE}/edits`);
          console.log(`edit=${edit.id}`);

          const { listings = [] } = await call('GET', `${BASE}/edits/${edit.id}/listings`);
          console.log(`등록정보 ${listings.length}개:`);
          for (const l of listings) console.log(`  ${l.language}: "${l.title}"`);

          if (dryRun) {
            console.log(`\n(dryRun) "${title}" 으로 바꾸지 않고 끝냅니다.`);
            process.exit(0);
          }

          // 제목만 바꾼다. 설명·스크린샷은 PATCH 로 건드리지 않는다.
          for (const l of listings) {
            const updated = await call('PATCH', `${BASE}/edits/${edit.id}/listings/${l.language}`, { title });
            console.log(`  ${l.language}: "${l.title}" → "${updated.title}"`);
          }

          await call('POST', `${BASE}/edits/${edit.id}:commit`);
          console.log(`\n✅ 앱 이름 변경 완료: "${title}"`);
          JS

      - name: 요약
        if: always()
        run: |
          {
            echo "### Play 등록정보"
            echo "- 앱 이름: **${{ inputs.title }}**"
            echo "- dryRun: \`${{ inputs.dryRun }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
